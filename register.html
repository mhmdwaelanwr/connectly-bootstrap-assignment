<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/page.css">
</head>
<body>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-xl-6 col-lg-7 col-md-9">

        <div class="text-center mb-4">
          <h1 class="site-name register-logo">Connectly</h1>
        </div>

        <div class="card register-card border-0 shadow">
          <div class="card-body p-4 p-md-5">
            <h2 class="fw-bold mb-1">Create Account</h2>
            <p class="text-secondary mb-4">It is quick and easy.</p>

            <div id="registerMessage"></div>

            <form id="registerForm">
              <div class="row g-3">
                <div class="col-sm-6">
                  <label for="firstName" class="form-label">First Name</label>
                  <input id="firstName" type="text" class="form-control" placeholder="First name">
                </div>

                <div class="col-sm-6">
                  <label for="lastName" class="form-label">Last Name</label>
                  <input id="lastName" type="text" class="form-control" placeholder="Last name">
                </div>

                <div class="col-12">
                  <label for="mailAddress" class="form-label">Email</label>
                  <input id="mailAddress" type="email" class="form-control" placeholder="name@example.com">
                </div>

                <div class="col-12">
                  <label for="phoneNumber" class="form-label">Phone Number</label>
                  <input id="phoneNumber" type="tel" class="form-control" placeholder="01xxxxxxxxx">
                </div>

                <div class="col-md-6">
                  <label for="newPassword" class="form-label">Password</label>
                  <input id="newPassword" type="password" class="form-control" placeholder="At least 6 characters">
                </div>

                <div class="col-md-6">
                  <label for="repeatPassword" class="form-label">Confirm Password</label>
                  <input id="repeatPassword" type="password" class="form-control" placeholder="Repeat password">
                </div>

                <div class="col-12">
                  <label class="form-label d-block mb-2">Gender</label>
                  <div class="d-flex gap-4">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="gender" value="male" id="maleOption">
                      <label class="form-check-label" for="maleOption">Male</label>
                    </div>

                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="gender" value="female" id="femaleOption">
                      <label class="form-check-label" for="femaleOption">Female</label>
                    </div>
                  </div>
                </div>

                <div class="col-12">
                  <label for="birthDate" class="form-label">Birthdate</label>
                  <input id="birthDate" type="date" class="form-control">
                </div>
              </div>

              <button type="submit" class="btn btn-success btn-lg w-100 mt-4 fw-bold">Sign Up</button>
            </form>

            <p class="text-center mt-4 mb-0">
              Already have an account?
              <a href="index.html" class="small-link">Log in</a>
            </p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/register-check.js"></script>
</body>
</html>
