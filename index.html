<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connectly Login</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/page.css">
</head>
<body>

  <main class="container min-vh-100 d-flex align-items-center py-5">
    <div class="row w-100 align-items-center justify-content-center g-5">

      <div class="col-lg-6 col-md-8 text-center text-lg-start intro-box">
        <h1 class="site-name">Connectly</h1>
        <p class="lead intro-text">
          Connect with friends and people around you in one simple place.
        </p>
      </div>

      <div class="col-lg-5 col-md-8">
        <div class="card login-card border-0 shadow">
          <div class="card-body p-4">

            <div id="loginMessage"></div>

            <form id="loginForm">
              <div class="mb-3">
                <input id="userLogin" class="form-control form-control-lg" type="text"
                  placeholder="Email address or phone number" autocomplete="off">
              </div>

              <div class="mb-2">
                <input id="userPassword" class="form-control form-control-lg" type="password"
                  placeholder="Password">
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="showPassword">
                <label class="form-check-label" for="showPassword">Show password</label>
              </div>

              <button class="btn btn-primary btn-lg w-100 fw-bold" type="submit">Log In</button>
            </form>

            <div class="text-center mt-3">
              <a href="#" class="small-link">Forgot password?</a>
            </div>

            <hr class="my-4">

            <div class="text-center">
              <a href="register.html" class="btn btn-success fw-bold px-4 py-2">
                Create New Account
              </a>
            </div>
          </div>
        </div>

        <p class="text-center mt-4 mb-0 small bottom-text">
          <a href="#" class="fw-bold text-dark text-decoration-none">Create a Page</a>
          for a public figure, brand or business.
        </p>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login-check.js"></script>
</body>
</html>
